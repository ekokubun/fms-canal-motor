name: Testes

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar pacote + deps de teste
        run: pip install -e ".[boletim,dev]"
      - name: Rodar testes
        run: pytest -v
